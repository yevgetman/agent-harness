# Harness managed file: application-corpus-legibility
legibility:
  version: 1
  updated: 2026-06-09
  scope: harness-source-repo
  surfaces:
    - id: harness-cli-entrypoint
      title: Harness CLI entrypoint
      kind: entrypoint
      status: active
      summary: The `harness` command dispatcher exposes install, lifecycle, profile, module, validation, memory, capture, legibility, reports, reconciliation, gardening, backup, and distribution surfaces.
      how_to_inspect: Run the CLI help and inspect the dispatcher before changing command routing.
      commands:
        - node scripts/harness.mjs --help
      references:
        - scripts/harness.mjs
        - package.json
      tags:
        - cli
        - lifecycle

    - id: module-profile-registry
      title: Module and profile registry
      kind: source-map
      status: active
      summary: The module registry and profile files define what can be installed into target repos, what the full profile includes, and how profile alignment can be planned or cleanly applied.
      how_to_inspect: List modules and profiles, then inspect module definitions and profile sync output before changing profile-backed install behavior.
      commands:
        - npm run modules:list
        - npm run profiles:list
        - npm run profiles:inspect -- full
        - npm run profiles:sync -- --plan
        - npm run profiles:sync -- --apply
      references:
        - modules/registry.yaml
        - profiles/full.yaml
        - profiles/minimal.yaml
      tags:
        - modules
        - profiles

    - id: dogfood-validation-stack
      title: Dogfood validation stack
      kind: health-check
      status: active
      summary: Doctor, focused domain checks, and the test suite are the primary deterministic inspection path for the harness source repo.
      how_to_inspect: Run doctor and tests after changing installed artifacts, modules, CLI entrypoints, or package contents.
      commands:
        - npm run doctor
        - npm test
        - npm run lock:check
      references:
        - scripts/doctor.mjs
        - scripts/test.mjs
        - docs/v1-validation.md
      tags:
        - validation
        - dogfood

    - id: distribution-smoke-surface
      title: Distribution smoke surface
      kind: check
      status: active
      summary: Distribution checks prove the package boundary, packed package install, global CLI install, and copied target smoke behavior.
      how_to_inspect: Run package validation and smoke commands after changing package contents, CLI entrypoints, profile installation, or distribution behavior.
      commands:
        - npm run distribution:check
        - npm run distribution:smoke
        - npm run distribution:global-smoke
      references:
        - scripts/distribution.mjs
        - docs/install.md
        - design/v1-distribution-readiness-design.md
      tags:
        - distribution
        - smoke

    - id: meetingly-copied-smoke
      title: Meetingly copied real-repo smoke
      kind: smoke-target
      status: active
      summary: "`~/code/meetingly` is the first named real-repo smoke target, exercised through disposable copies rather than source-owned installation tracking."
      how_to_inspect: Run copied external-target distribution smoke for minimal and full profiles when lifecycle behavior changes.
      commands:
        - node scripts/harness.mjs distribution smoke --target /Users/julie/code/meetingly --profile minimal --force
        - node scripts/harness.mjs distribution smoke --target /Users/julie/code/meetingly --profile full --force
      references:
        - design/v1.1-installed-instance-roadmap.md
        - docs/v1-validation.md
      tags:
        - real-repo
        - smoke

    - id: reports-overview-surface
      title: Reports overview surface
      kind: generated-report
      status: active
      summary: The reports catalog and generator provide a cross-domain installed-harness overview for broad status, roadmap, and handoff work.
      how_to_inspect: Run the reports check and generator before broad current-state updates.
      commands:
        - npm run reports:check
        - npm run reports:generate
      references:
        - reports/catalog.yaml
        - scripts/reports.mjs
        - design/v1-reports-retrieval-design.md
      tags:
        - reports
        - overview
        - dogfood

    - id: reconciliation-plan-surface
      title: Reconciliation plan surface
      kind: generated-report
      status: active
      summary: Reconciliation rules and the plan command provide a read-only installed-harness drift view before lifecycle mutation or broad handoff work.
      how_to_inspect: Run reconciliation checks and plan output after changing manifest, lock, profile, module, command, metadata, state, or plan surfaces.
      commands:
        - npm run reconcile:check
        - npm run reconcile:plan
      references:
        - reconciliation/rules.yaml
        - scripts/reconcile.mjs
        - design/v1-reconciliation-drift-detection-design.md
      tags:
        - reconciliation
        - drift-detection
        - dogfood

    - id: garden-plan-surface
      title: Garden plan surface
      kind: generated-report
      status: active
      summary: Gardening rules, thresholds, action policy, and the plan command provide a read-only cleanup-pressure view before archive, trim, deletion, or broad handoff work.
      how_to_inspect: Run gardening checks and plan output after changing capture, plans, status, memory, snapshots, reports, lock surfaces, thresholds, or cleanup action policy.
      commands:
        - npm run garden:check
        - npm run garden:plan
      references:
        - gardening/rules.yaml
        - scripts/garden.mjs
        - design/v1-gardening-entropy-management-design.md
      tags:
        - gardening
        - entropy-management
        - dogfood

    - id: lifecycle-backup-surface
      title: Lifecycle backup and rollback surface
      kind: source-map
      status: active
      summary: The lifecycle backup helper and rollback planner create and inspect local recovery snapshots for supported repo mutations.
      how_to_inspect: Inspect backup helper behavior, rollback planning behavior, and mutation command call sites before changing module add, profile switch apply, profile sync apply, upgrade apply, destroy confirm, or recovery planning behavior.
      commands:
        - node --check scripts/lifecycle-backup.mjs
        - node --check scripts/rollback.mjs
        - node scripts/harness.mjs rollback --help
        - npm test
      references:
        - scripts/lifecycle-backup.mjs
        - scripts/rollback.mjs
        - scripts/modules.mjs
        - scripts/profiles.mjs
        - scripts/upgrade.mjs
        - scripts/destroy.mjs
        - decisions/0043-adopt-lifecycle-backups-before-safe-mutations.md
        - decisions/0044-adopt-rollback-planning-from-lifecycle-backups.md
      tags:
        - lifecycle
        - backup
        - rollback
        - mutation-safety
