# Harness open questions.
# Harness managed file: decisions-open-questions
#
# Keep unresolved questions here when they affect design, implementation,
# compatibility, upgrade behavior, or future process-domain choices.

- id: distribution-target
  title: Which distribution target should be assumed first?
  status: open
  owner: maintainer
  trigger: before the CLI needs to be consumed outside this local checkout
  notes: Candidate targets are Bun, npm, Homebrew, and standalone binary.

- id: upgrade-version-source
  title: How should upgrade discover available harness and module versions?
  status: deferred
  owner: maintainer
  trigger: before harness upgrade --plan is used outside this local checkout
  notes: Current v1 planner intentionally uses a local-checkout version source; external package or registry discovery remains deferred until distribution is chosen.
