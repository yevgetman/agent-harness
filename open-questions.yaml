# Harness open questions.
# Harness managed file: decisions-open-questions
#
# Keep unresolved questions here when they affect design, implementation,
# compatibility, upgrade behavior, or future process-domain choices.

- id: distribution-target
  title: Which distribution target should be assumed first?
  status: resolved
  owner: maintainer
  trigger: before the CLI needs to be consumed outside this local checkout
  notes: V1 assumes local packed npm tarball distribution. Public npm registry publication is deferred.

- id: upgrade-version-source
  title: How should upgrade discover available harness and module versions?
  status: resolved
  owner: maintainer
  trigger: before harness upgrade --plan is used outside this local checkout
  notes: V1 reports local-checkout for the dogfood repo and package source with npm registry discovery/fallback for package-installed targets.

- id: lock-source-sha-drift-on-module-install
  title: Why does lock check report source_sha256 drift on template-installed managed files?
  status: resolved
  owner: maintainer
  trigger: before lock check is offered as a hard correctness gate on installed instances
  notes: |
    Resolved by decision 0030. `lock check` and `lock refresh` now resolve
    template source fingerprints from the executing harness source/package root
    before falling back to target-local paths. Fresh dogfood installs, module
    adds, and profile switch apply runs can therefore validate template-backed
    source provenance without false drift.
