      completed_on: 2026-05-15
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness plans check validates plans/current.yaml.
            - harness plans list supports status, owner-domain, priority, and JSON filters.
            - harness plans report emits status, priority, and owner-domain summaries.
            - plans-and-status is installable through modules add.
            - The full profile includes plans-and-status.
        - id: validation
          status: satisfied
          evidence:
            - Plans validation checks version, status projection, required fields, unique IDs, allowed statuses, allowed priorities, tags, and references.
            - Plans validation requires next_action for active and blocked plans.
            - Plans validation checks canonical_state_id references when Canonical State is available.
            - harness doctor consumes Plans validation through validatePlansStatus.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers plans-and-status module installation.
            - npm test covers plans check, list filters, report summaries, and JSON output.
            - npm test covers invalid plan status validation failure.
            - npm test covers missing plan reference validation failure.
            - npm test covers full profile installation with plans-and-status.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-plans-status-design.md defines the Plans And Status domain baseline.
            - decisions/0014-adopt-plans-and-status-module.md records the decision.
            - AGENTS.md, design/v1-product-spec-and-roadmap.md, state/CONTEXT.md, status.md, and index.yaml describe the installed domain.
        - id: dogfood-usage
          status: satisfied
          evidence:
