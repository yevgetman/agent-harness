        - id: tests
          status: satisfied
          evidence:
            - npm test covers invariants-golden-principles module installation.
            - npm test covers invariants check success and JSON output.
            - npm test covers unknown canonical_state_id validation failure.
            - npm test covers missing required text validation failure.
            - npm test covers full profile installation with invariants-golden-principles.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-invariants-golden-principles-design.md defines the Invariants And Golden Principles domain baseline.
            - decisions/0013-adopt-invariants-and-golden-principles-module.md records the decision.
            - AGENTS.md, design/v1-product-spec-and-roadmap.md, state/CONTEXT.md, status.md, and index.yaml describe the installed domain.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - invariants-golden-principles is installed in .harness/manifest.yaml.
            - invariants/golden-principles.yaml captures current dogfood rules.
            - npm run invariants:check, npm run state:check, npm run metadata:check, npm run doctor, npm run upgrade:plan, npm run lock:check, and npm test pass against the dogfood repo.

    - id: plans-and-status-module
      breadth_unit: >
        Add Plans And Status as the fourth Phase 4 process-domain module with a
        structured plans/status registry, list/check/report commands,
        status-projection validation, plan-reference validation, doctor
