build_strategy:
  version: 1
  status: active
  scope: harness-repo-local
  strategy_doc: design/v1-incremental-build-strategy.md
  portable_process_domain: false
  enforcement:
    - AGENTS.md cites the strategy document.
    - state/CONTEXT.md summarizes the active strategy.
    - harness doctor validates this file when present.

  completed_depth_passes:
    - id: initial-tooling-and-first-domains
      breadth_unit: >
        Agent Operating Contract, Progressive Orientation, Decisions And Open
        Questions, minimal init, doctor, and list/create commands.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - npm run init installs the minimal profile.
            - npm run doctor validates dogfood and installed targets.
            - npm run decisions:new creates decision records.
            - npm run decisions:list lists decision records.
            - npm run questions:list lists open questions.
        - id: validation
          status: satisfied
          evidence:
            - doctor validates manifest, module, managed-file, index, status, decision, and question shape.
            - doctor validates this depth-gate artifact when present.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers init safety, doctor success and failure paths, decisions, questions, and fixtures.
        - id: docs
          status: satisfied
          evidence:
            - AGENTS.md, status.md, state/CONTEXT.md, index.yaml, and docs/minimal-profile.md describe current behavior.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - The harness repo runs as the first dogfood target.
            - The dogfood manifest records active modules and commands.

    - id: upgrade-plan-lifecycle
      breadth_unit: >
        Add a narrow harness lifecycle surface through harness upgrade --plan.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness upgrade --plan produces a read-only upgrade plan.
            - upgrade plan reports version source, modules, managed files, commands, actions, warnings, blockers, and notes.
        - id: validation
          status: satisfied
          evidence:
            - doctor validates that the upgrade plan command is wired.
            - upgrade plan uses an explicit local-checkout version source.
            - upgrade plan reports managed-file missing blockers and harness-management marker warnings.
            - upgrade plan reports command wiring blockers.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers upgrade plan success and missing-manifest failure.
            - npm test covers missing managed-file blockers, command blockers, and unmarked managed-file warnings in real initialized git targets.
        - id: docs
          status: satisfied
          evidence:
            - status.md, index.yaml, docs/minimal-profile.md, design/v1-product-spec-and-roadmap.md, and design/v1-installed-manifest-design.md describe the plan-first command, local-checkout version source, and product roadmap context.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - The dogfood manifest exposes upgrade-plan.
            - Dogfood managed files include harness-management markers.
            - npm run upgrade:plan has been run against the dogfood repo and reports no blockers or warnings.
            - Real initialized git target upgrade scenarios are covered by tests.

    - id: module-profile-installation
      breadth_unit: >
        Add registry-backed module listing and module installation for the
        first standalone process-domain module.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness modules list reports registry modules with installed and installable state.
            - harness modules add installs decisions-open-questions into a minimal target.
            - Module install preflights target collisions and source template availability before writing.
            - Module install updates the target manifest with module, managed-file, and command records.
        - id: validation
          status: satisfied
          evidence:
            - doctor validates source registry shape when modules/registry.yaml is present.
            - doctor validates profile records when profiles/ exists.
            - doctor warns when installed modules are absent from the source registry.
            - upgrade plan reports registry-available modules that are not installed in the target.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers module list visibility against a real initialized git target.
            - npm test covers clean decisions-open-questions module installation.
            - npm test covers collision refusal, --force install, unknown module failure, bootstrap module no-op, and missing source template preflight.
            - npm test covers doctor and upgrade plan after module installation.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-module-profile-installation-design.md defines registry, profile, module install metadata, doctor behavior, and upgrade plan behavior.
            - design/v1-product-spec-and-roadmap.md marks the first Phase 2 module-add increment depth-complete and lists the initial module commands.
            - docs/minimal-profile.md describes follow-on module installation from the minimal profile.
            - status.md, state/CONTEXT.md, index.yaml, and AGENTS.md describe the current module/profile surface.
            - decisions/0004-adopt-registry-backed-module-installation-surface.md records the module installation decision.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - The dogfood manifest exposes modules-list and modules-add.
            - npm run modules:list has been run against the dogfood repo.
            - A targeted temp-repo dogfood run verified minimal init followed by modules add decisions-open-questions, doctor, and upgrade plan.
            - npm run doctor, npm test, and npm run upgrade:plan pass against the dogfood repo.

    - id: profile-backed-init-and-listing
      breadth_unit: >
        Make profiles listable and make harness init consume profile module
        bundles from profiles/*.yaml.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness profiles list reports source profiles and module bundles.
            - harness init --profile minimal resolves the minimal profile from profiles/minimal.yaml.
            - harness init --profile dogfood resolves the dogfood profile and installs decisions-open-questions artifacts.
            - Generated manifests expose profiles-list alongside module and upgrade commands.
        - id: validation
          status: satisfied
          evidence:
            - doctor validates profile IDs, filenames, status values, duplicate module entries, and registry membership.
            - Profile-backed init refuses unknown profiles and profiles missing required bootstrap modules.
            - doctor validates dogfood profile installs in real temp git targets.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers profiles list.
            - npm test covers profile-backed minimal init.
            - npm test covers profile-backed dogfood init, including doctor, module list, and upgrade plan.
            - npm test covers unsupported profile failure.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-module-profile-installation-design.md describes profile listing and profile-backed init.
            - design/v1-product-spec-and-roadmap.md lists profiles list and profile-backed init in the current product surface.
            - docs/minimal-profile.md notes that the minimal profile is read from profiles/minimal.yaml.
            - status.md, state/CONTEXT.md, index.yaml, and AGENTS.md describe profile listing and profile-backed init.
            - decisions/0005-adopt-profile-backed-init-and-profile-listing.md records the decision.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - The dogfood manifest exposes profiles-list.
            - npm run profiles:list has been run against the dogfood repo.
            - npm run doctor, npm test, and npm run upgrade:plan pass against the dogfood repo.

    - id: lock-provenance-baseline
      breadth_unit: >
        Add baseline installed-file provenance with .harness/lock.yaml and make
        doctor and upgrade planning consume it.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness init writes .harness/lock.yaml for planned non-directory install artifacts.
            - harness modules add updates .harness/lock.yaml for module artifacts and .harness/manifest.yaml.
            - harness upgrade --plan reports lock status and classifies managed files with lock fingerprints.
        - id: validation
          status: satisfied
          evidence:
            - harness doctor validates lock version, file entries, SHA-256 shape, locked-file presence, and fingerprint drift.
            - harness upgrade --plan treats missing managed files as blockers and modified locked managed files as warnings.
            - Legacy missing-lock targets remain diagnosable through warnings.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers lock creation during init.
            - npm test covers module add updating lock entries.
            - npm test covers upgrade-plan lock reporting, missing-file blockers, and modified-file warnings.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-lock-provenance-design.md defines the lock shape and Phase 3 behavior.
            - design/v1-product-spec-and-roadmap.md marks Phase 3 active and records baseline lock behavior.
            - status.md, state/CONTEXT.md, index.yaml, and AGENTS.md describe the current lock/provenance surface.
            - decisions/0006-adopt-installed-lock-provenance.md records the provenance decision.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - The dogfood repo carries .harness/lock.yaml.
            - npm run doctor, npm run upgrade:plan, and npm test pass against the dogfood repo after lock generation.

    - id: lock-refresh-check-command
      breadth_unit: >
        Add first-class lock refresh and check commands so installed-file
        provenance can be maintained without ad hoc scripts.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness lock refresh rebuilds .harness/lock.yaml from .harness/manifest.yaml and current installed files.
            - harness lock check reports lock drift without writing.
            - harness lock refresh --check aliases the read-only check behavior.
        - id: validation
          status: satisfied
          evidence:
            - harness lock refresh refuses to write when expected manifest/module/managed files are missing.
            - harness doctor hints now point to harness lock refresh when lock provenance is missing.
            - upgrade planning continues to consume refreshed lock fingerprints.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers clean lock check after init.
            - npm test covers drift detection after managed-file modification.
            - npm test covers lock refresh restoring a clean check.
            - npm test covers lock refresh refusing missing expected files.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-lock-provenance-design.md defines lock refresh and check behavior.
            - AGENTS.md, docs/minimal-profile.md, state/CONTEXT.md, status.md, index.yaml, and design/v1-product-spec-and-roadmap.md describe the lock command surface.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - The dogfood manifest exposes lock-refresh and lock-check.
            - npm run lock:refresh has been used to refresh .harness/lock.yaml.
            - npm run lock:check, npm run doctor, npm run upgrade:plan, and npm test pass against the dogfood repo.

    - id: upgrade-plan-operation-classification
      breadth_unit: >
        Add typed upgrade-plan operation records so detected state maps to safe,
        review-required, blocked, or deferred work.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness upgrade --plan emits an operations list in addition to actions, warnings, blockers, and notes.
            - Operations include safe/noop, safe/refresh-lock, review/*, blocked/*, and deferred/* classes.
            - Operation records include code, status, subject type, subject, and detail.
        - id: validation
          status: satisfied
          evidence:
            - Missing managed files are classified as blocked/missing-managed-file.
            - Modified managed files are classified as review/modified-managed-file.
            - Missing and unlocked lock provenance produce review operations plus safe refresh-lock follow-ups.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers clean safe/noop and deferred/apply-not-implemented operations.
            - npm test covers blocked/missing-managed-file for missing managed files.
            - npm test covers review/modified-managed-file for lock drift.
            - npm test covers review/missing-lock and review/unlocked-managed-file scenarios.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-lock-provenance-design.md defines initial operation codes.
            - design/v1-product-spec-and-roadmap.md, design/v1-installed-manifest-design.md, docs/minimal-profile.md, state/CONTEXT.md, status.md, and index.yaml describe operation classification.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - npm run upgrade:plan has been run against the dogfood repo and reports typed operations with no blockers or warnings.
            - npm run lock:check, npm run doctor, and npm test pass against the dogfood repo.

    - id: safe-upgrade-apply-scaffold
      breadth_unit: >
        Add operation summaries, richer source provenance, and a limited upgrade
        apply scaffold for safe/noop and safe/refresh-lock operations.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness upgrade --plan emits operation_summary counts by status and code.
            - Lock entries preserve source_path and source_sha256 for module definitions and template artifacts when source data is available.
            - harness upgrade apply accepts safe/noop plans and can execute safe/refresh-lock operations.
        - id: validation
          status: satisfied
          evidence:
            - harness upgrade apply refuses blocked plans.
            - harness upgrade apply refuses review-required plans.
            - harness doctor validates the upgrade-apply command wiring in the dogfood manifest.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers operation summaries.
            - npm test covers template source provenance on module-installed artifacts.
            - npm test covers safe upgrade apply, blocked apply refusal, and review-required apply refusal.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-lock-provenance-design.md defines operation summaries and safe apply behavior.
            - decisions/0007-adopt-safe-upgrade-apply-scaffold.md records the safe apply decision.
            - AGENTS.md, design/v1-product-spec-and-roadmap.md, design/v1-installed-manifest-design.md, docs/minimal-profile.md, state/CONTEXT.md, status.md, and index.yaml describe the current apply scaffold.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - The dogfood manifest exposes upgrade-apply.
            - npm run upgrade:apply has been run against the dogfood repo.
            - npm run lock:check, npm run doctor, npm run upgrade:plan, and npm test pass against the dogfood repo.

    - id: upgrade-operation-contract-closeout
      breadth_unit: >
        Close Phase 3 lifecycle depth with a formal upgrade operation contract,
        stable JSON plans, semantic lock provenance, and deterministic safe
        command repair.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness upgrade --plan includes plan_schema_version and operation_contract_version.
            - harness upgrade --plan --json emits parseable machine-readable plan JSON.
            - Lock entries include semantic provenance fields such as artifact_role, owner_type, module_id, merge_strategy, and source_kind.
            - harness upgrade apply can execute safe/repair-command by restoring deterministic missing package scripts.
        - id: validation
          status: satisfied
          evidence:
            - harness doctor validates semantic lock provenance field shapes.
            - harness upgrade apply still refuses blocked and review-required plans.
            - safe/repair-command requires a known source package script and local file prerequisites.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers JSON upgrade plans.
            - npm test covers semantic lock provenance fields.
            - npm test covers deterministic safe command repair.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-upgrade-operation-contract.md defines the operation contract.
            - design/v1-lock-provenance-design.md describes semantic provenance and apply behavior.
            - decisions/0008-adopt-upgrade-operation-contract-closeout.md records the closeout decision.
            - AGENTS.md, design/v1-product-spec-and-roadmap.md, design/v1-installed-manifest-design.md, docs/minimal-profile.md, state/CONTEXT.md, status.md, and index.yaml describe the current contract.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - The dogfood repo emits a clean JSON upgrade plan.
            - npm run lock:check, npm run doctor, npm run upgrade:plan, npm run upgrade:apply, and npm test pass against the dogfood repo.

    - id: structured-metadata-module
      breadth_unit: >
        Add Structured Metadata as the first Phase 4 process-domain module with
        an artifact registry, metadata list/check commands, doctor validation,
        profile wiring, and dogfood installation.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness metadata list lists metadata/artifacts.yaml entries.
            - harness metadata check validates metadata/artifacts.yaml.
            - structured-metadata is installable through modules add.
            - The dogfood profile includes structured-metadata.
        - id: validation
          status: satisfied
          evidence:
            - harness doctor validates metadata/artifacts.yaml when structured-metadata is installed.
            - Metadata validation checks version, required fields, unique IDs, allowed statuses, list fields, and active artifact paths.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers structured-metadata module installation.
            - npm test covers metadata list/check success.
            - npm test covers metadata check failure for missing active artifact paths.
            - npm test covers dogfood profile installation with structured-metadata.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-structured-metadata-design.md defines the Structured Metadata domain baseline.
            - decisions/0009-adopt-structured-metadata-as-first-phase-4-module.md records the decision.
            - AGENTS.md, design/v1-product-spec-and-roadmap.md, state/CONTEXT.md, status.md, and index.yaml describe the installed domain.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - structured-metadata is installed in .harness/manifest.yaml.
            - metadata/artifacts.yaml describes current dogfood artifacts.
            - npm run metadata:check, npm run doctor, npm run upgrade:plan, npm run lock:check, and npm test pass against the dogfood repo.

    - id: structured-metadata-query-validation
      breadth_unit: >
        Deepen Structured Metadata with filtered and JSON query output, report
        summaries, and dependency-reference validation before adding more Phase
        4 breadth.
      completed_on: 2026-05-14
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness metadata list supports --tag, --kind, --status, and --json.
            - harness metadata check supports --json.
            - harness metadata report emits status, kind, and tag summaries.
        - id: validation
          status: satisfied
          evidence:
            - Metadata validation rejects unknown artifact dependencies.
            - Metadata validation rejects self-dependencies.
            - harness doctor consumes the deeper validation through validateMetadata.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers metadata tag and kind filters.
            - npm test covers metadata list/report JSON output.
            - npm test covers metadata report summaries.
            - npm test covers unknown dependency validation failure.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-structured-metadata-design.md describes filters, JSON, reports, and dependency validation.
            - decisions/0010-deepen-structured-metadata-query-and-validation.md records the depth decision.
            - AGENTS.md, design/v1-product-spec-and-roadmap.md, state/CONTEXT.md, status.md, and index.yaml describe the deeper behavior.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - metadata/artifacts.yaml now records artifact dependencies.
            - npm run metadata:check, npm run metadata:report, npm run doctor, npm run upgrade:plan, npm run lock:check, and npm test pass against the dogfood repo.

    - id: canonical-state-module
      breadth_unit: >
        Add Canonical State as the second Phase 4 process-domain module with an
        authority-role registry, state check command, metadata-reference
        validation, doctor validation, profile wiring, and dogfood installation.
      completed_on: 2026-05-15
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness state check validates state/canonical-state.yaml.
            - harness state check --json emits parseable machine-readable output.
            - canonical-state is installable through modules add.
            - The dogfood profile includes canonical-state.
        - id: validation
          status: satisfied
          evidence:
            - Canonical State validation checks version, required fields, unique IDs, allowed statuses, allowed state roles, active paths, and dependency references.
            - Canonical State validation checks metadata_id references against metadata/artifacts.yaml when metadata is available.
            - harness doctor consumes Canonical State validation through validateCanonicalState.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers canonical-state module installation.
            - npm test covers state check success and JSON output.
            - npm test covers unknown metadata_id validation failure.
            - npm test covers invalid state_role validation failure.
            - npm test covers dogfood profile installation with canonical-state.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-canonical-state-design.md defines the Canonical State domain baseline.
            - decisions/0011-adopt-canonical-state-as-second-phase-4-module.md records the decision.
            - AGENTS.md, design/v1-product-spec-and-roadmap.md, state/CONTEXT.md, status.md, and index.yaml describe the installed domain.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - canonical-state is installed in .harness/manifest.yaml.
            - state/canonical-state.yaml classifies current dogfood state authority.
            - npm run state:check, npm run metadata:check, npm run doctor, npm run upgrade:plan, npm run lock:check, and npm test pass against the dogfood repo.

    - id: canonical-state-query-reporting
      breadth_unit: >
        Deepen Canonical State with filtered and JSON query output plus report
        summaries before adding more Phase 4 breadth.
      completed_on: 2026-05-15
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness state list supports --role, --status, --owner-domain, and --json.
            - harness state report emits role, status, owner-domain, and refresh summaries.
            - harness state report supports filtered and JSON output.
        - id: validation
          status: satisfied
          evidence:
            - State list and report consume validateCanonicalState before returning entries.
            - The dogfood manifest wires state-list, state-check, and state-report commands.
            - harness doctor validates the expanded command wiring.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers state role, status, and owner-domain filters.
            - npm test covers state list JSON output.
            - npm test covers state report summaries and JSON output.
            - npm test covers dogfood profile state report usage.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-canonical-state-design.md describes list, report, filters, and JSON output.
            - decisions/0012-deepen-canonical-state-query-and-reporting.md records the depth decision.
            - design/v1-product-spec-and-roadmap.md, state/CONTEXT.md, status.md, and index.yaml describe the deeper behavior.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - npm run state:list -- --role projection has been run against the dogfood repo.
            - npm run state:report has been run against the dogfood repo.
            - npm run state:check, npm run metadata:check, npm run doctor, npm run upgrade:plan, npm run lock:check, and npm test pass against the dogfood repo.

  current_depth_pass:
    id: invariants-golden-principles-module
    breadth_unit: >
      Add Invariants And Golden Principles as the third Phase 4 process-domain
      module with a checked invariant registry, simple file checks,
      canonical-state reference validation, doctor validation, profile wiring,
      and dogfood installation.
    status: complete
    ready_for_next_breadth: true
    depth_criteria:
      - id: executable-behavior
        status: satisfied
        evidence:
          - harness invariants check validates invariants/golden-principles.yaml.
          - harness invariants check --json emits parseable machine-readable output.
          - invariants-golden-principles is installable through modules add.
          - The dogfood profile includes invariants-golden-principles.
      - id: validation
        status: satisfied
        evidence:
          - Invariants validation checks version, required fields, unique IDs, allowed statuses, allowed severities, tags, and checks.
          - Invariants validation runs active file_exists and file_contains checks.
          - Invariants validation checks canonical_state_id references when Canonical State is available.
          - harness doctor consumes Invariants validation through validateInvariants.
      - id: tests
        status: satisfied
        evidence:
          - npm test covers invariants-golden-principles module installation.
          - npm test covers invariants check success and JSON output.
          - npm test covers unknown canonical_state_id validation failure.
          - npm test covers missing required text validation failure.
          - npm test covers dogfood profile installation with invariants-golden-principles.
      - id: docs
        status: satisfied
        evidence:
          - design/v1-invariants-golden-principles-design.md defines the Invariants And Golden Principles domain baseline.
          - decisions/0013-adopt-invariants-and-golden-principles-module.md records the decision.
          - AGENTS.md, design/v1-product-spec-and-roadmap.md, state/CONTEXT.md, status.md, and index.yaml describe the installed domain.
      - id: dogfood-usage
        status: satisfied
        evidence:
          - invariants-golden-principles is installed in .harness/manifest.yaml.
          - invariants/golden-principles.yaml captures current dogfood rules.
          - npm run invariants:check, npm run state:check, npm run metadata:check, npm run doctor, npm run upgrade:plan, npm run lock:check, and npm test pass against the dogfood repo.
