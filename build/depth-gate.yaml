      completed_on: 2026-05-15
      ready_for_next_breadth: true
      depth_criteria:
        - id: executable-behavior
          status: satisfied
          evidence:
            - harness state list supports --role, --status, --owner-domain, and --json.
            - harness state report emits role, status, owner-domain, and refresh summaries.
            - harness state report supports filtered and JSON output.
        - id: validation
          status: satisfied
          evidence:
            - State list and report consume validateCanonicalState before returning entries.
            - The dogfood manifest wires state-list, state-check, and state-report commands.
            - harness doctor validates the expanded command wiring.
        - id: tests
          status: satisfied
          evidence:
            - npm test covers state role, status, and owner-domain filters.
            - npm test covers state list JSON output.
            - npm test covers state report summaries and JSON output.
            - npm test covers full profile state report usage.
        - id: docs
          status: satisfied
          evidence:
            - design/v1-canonical-state-design.md describes list, report, filters, and JSON output.
            - decisions/0012-deepen-canonical-state-query-and-reporting.md records the depth decision.
            - design/v1-product-spec-and-roadmap.md, state/CONTEXT.md, status.md, and index.yaml describe the deeper behavior.
        - id: dogfood-usage
          status: satisfied
          evidence:
            - npm run state:list -- --role projection has been run against the dogfood repo.
            - npm run state:report has been run against the dogfood repo.
            - npm run state:check, npm run metadata:check, npm run doctor, npm run upgrade:plan, npm run lock:check, and npm test pass against the dogfood repo.

    - id: invariants-golden-principles-module
      breadth_unit: >
