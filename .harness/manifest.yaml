harness:
  manifest_version: 1
  installed_at: 2026-05-14
  harness_version: 0.1.0
  profile: full
  source:
    type: local
    path: ~/code/harness
    channel: dev
    install_model: installed-instance
  modules:
    - id: agent-operating-contract
      version: 0.1.0
      status: active
      process_domains:
        - agent-operating-contract
    - id: progressive-orientation
      version: 0.1.0
      status: active
      process_domains:
        - progressive-orientation
    - id: decisions-open-questions
      version: 0.1.0
      status: active
      process_domains:
        - decisions-and-open-questions
    - id: structured-metadata
      version: 0.1.0
      status: active
      process_domains:
        - structured-metadata
    - id: canonical-state
      version: 0.1.0
      status: active
      process_domains:
        - canonical-state
    - id: invariants-golden-principles
      version: 0.1.0
      status: active
      process_domains:
        - invariants-and-golden-principles
    - id: plans-and-status
      version: 0.1.0
      status: active
      process_domains:
        - plans-and-status
    - id: durable-memory
      version: 0.1.0
      status: active
      process_domains:
        - durable-memory
    - id: capture-triage
      version: 0.1.0
      status: active
      process_domains:
        - capture-and-triage
    - id: application-corpus-legibility
      version: 0.1.0
      status: active
      process_domains:
        - application-corpus-legibility
    - id: reports-retrieval
      version: 0.1.0
      status: active
      process_domains:
        - reports-and-retrieval
    - id: reconciliation-drift-detection
      version: 0.1.0
      status: active
      process_domains:
        - reconciliation-and-drift-detection
    - id: gardening-entropy-management
      version: 0.1.0
      status: active
      process_domains:
        - gardening-and-entropy-management
  managed_files:
    - path: AGENTS.md
      owner: agent-operating-contract
      mode: merge
    - path: status.md
      owner: agent-operating-contract
      mode: merge
    - path: index.yaml
      owner: progressive-orientation
      mode: merge
    - path: state/CONTEXT.md
      owner: progressive-orientation
      mode: merge
    - path: open-questions.yaml
      owner: decisions-open-questions
      mode: merge
    - path: templates/decision.md
      owner: decisions-open-questions
      mode: merge
    - path: metadata/artifacts.yaml
      owner: structured-metadata
      mode: merge
    - path: state/canonical-state.yaml
      owner: canonical-state
      mode: merge
    - path: invariants/golden-principles.yaml
      owner: invariants-golden-principles
      mode: merge
    - path: plans/current.yaml
      owner: plans-and-status
      mode: merge
    - path: memory/README.md
      owner: durable-memory
      mode: merge
    - path: memory/operator-preferences.yaml
      owner: durable-memory
      mode: merge
    - path: memory/repo-notes.md
      owner: durable-memory
      mode: merge
    - path: memory/session-summaries.md
      owner: durable-memory
      mode: merge
    - path: capture/README.md
      owner: capture-triage
      mode: merge
    - path: capture/inbox.yaml
      owner: capture-triage
      mode: merge
    - path: capture/triage.yaml
      owner: capture-triage
      mode: merge
    - path: legibility/README.md
      owner: application-corpus-legibility
      mode: merge
    - path: legibility/inventory.yaml
      owner: application-corpus-legibility
      mode: merge
    - path: legibility/notes.md
      owner: application-corpus-legibility
      mode: merge
    - path: reports/README.md
      owner: reports-retrieval
      mode: merge
    - path: reports/catalog.yaml
      owner: reports-retrieval
      mode: merge
    - path: reports/snapshots.md
      owner: reports-retrieval
      mode: merge
    - path: reconciliation/README.md
      owner: reconciliation-drift-detection
      mode: merge
    - path: reconciliation/rules.yaml
      owner: reconciliation-drift-detection
      mode: merge
    - path: reconciliation/snapshots.md
      owner: reconciliation-drift-detection
      mode: merge
    - path: gardening/README.md
      owner: gardening-entropy-management
      mode: merge
    - path: gardening/rules.yaml
      owner: gardening-entropy-management
      mode: merge
    - path: gardening/snapshots.md
      owner: gardening-entropy-management
      mode: merge
  commands:
    init: npm run init
    destroy: npm run destroy
    decisions-new: node scripts/harness.mjs decisions new
    decisions-list: node scripts/harness.mjs decisions list
    questions-list: node scripts/harness.mjs questions list
    modules-list: node scripts/harness.mjs modules list
    modules-add: node scripts/harness.mjs modules add
    profiles-list: node scripts/harness.mjs profiles list
    profiles-inspect: node scripts/harness.mjs profiles inspect
    profiles-switch: node scripts/harness.mjs profiles switch
    profiles-sync: node scripts/harness.mjs profiles sync
    lock-refresh: npm run lock:refresh
    lock-check: npm run lock:check
    upgrade-plan: node scripts/harness.mjs upgrade --plan
    upgrade-apply: npm run upgrade:apply
    doctor: npm run doctor
    test: npm test
    metadata-list: npm run metadata:list
    metadata-check: npm run metadata:check
    metadata-report: npm run metadata:report
    state-list: npm run state:list
    state-check: npm run state:check
    state-report: npm run state:report
    invariants-check: npm run invariants:check
    plans-list: npm run plans:list
    plans-check: npm run plans:check
    plans-report: npm run plans:report
    capture-list: npm run capture:list
    capture-add: npm run capture:add
    capture-triage: npm run capture:triage
    capture-check: npm run capture:check
    capture-report: npm run capture:report
    legibility-list: npm run legibility:list
    legibility-check: npm run legibility:check
    legibility-report: npm run legibility:report
    reports-list: npm run reports:list
    reports-check: npm run reports:check
    reports-report: npm run reports:report
    reports-generate: npm run reports:generate
    reconcile-list: npm run reconcile:list
    reconcile-check: npm run reconcile:check
    reconcile-report: npm run reconcile:report
    reconcile-plan: npm run reconcile:plan
    garden-list: npm run garden:list
    garden-check: npm run garden:check
    garden-report: npm run garden:report
    garden-plan: npm run garden:plan
    memory-list: npm run memory:list
    memory-check: npm run memory:check
    memory-report: npm run memory:report
    distribution-check: npm run distribution:check
    distribution-release-plan: npm run distribution:release-plan
    distribution-publish-plan: npm run distribution:publish-plan
    distribution-smoke: npm run distribution:smoke
    distribution-global-smoke: npm run distribution:global-smoke
  upgrade:
    policy: plan-first
    model: installed-instance
