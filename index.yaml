      - v1-incremental-build-strategy
      - v1-installed-manifest-design

  - doc_id: decision-0003
    file: decisions/0003-adopt-product-spec-and-roadmap-as-directional-v1-north-star.md
    title: Adopt Product Spec And Roadmap As Directional V1 North Star
    kind: decision
    status: active
    summary: Decision record adopting the product spec and roadmap as directional product guidance without replacing depth-gated incremental development.
    depends_on:
