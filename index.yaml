repo: harness
description: Portable harness source repo and first dogfood target.
updated: 2026-05-14
harness:
  package: portable-harness
  version: 0.1.0
  profile: dogfood

orientation:
  purpose: >
    Give agents a small boot path and a reading order before they inspect the
    full repo.
  boot_order:
    - AGENTS.md
    - status.md
    - index.yaml
    - state/CONTEXT.md
  rule: Start with the boot_order, then read only the relevant deeper docs.

reading_order:
  - agents
  - status
  - context
  - v1-product-spec-and-roadmap
  - v1-process-domain-design
  - v1-installed-manifest-design
  - v1-incremental-build-strategy
  - v1-decisions-open-questions-design
  - v1-module-profile-installation-design
  - installed-manifest
  - module-registry
  - profile-minimal
  - profile-dogfood
  - module-agent-operating-contract
  - module-progressive-orientation
  - module-decisions-open-questions
  - depth-gate
  - open-questions
  - decision-0001
  - decision-0002
  - decision-0003
  - decision-0004
  - decision-0005
  - decision-template
  - package
  - harness-cli
  - init
  - minimal-profile
  - modules-cli
  - profiles-cli
  - decisions-cli
  - questions-cli
  - upgrade-cli
  - doctor
  - test
  - doctor-fixtures
  - agnostic-harness-shape
  - portability-model

documents:
  - doc_id: agents
    file: AGENTS.md
    title: Harness Agent Instructions
    kind: operating-contract
    status: active
    summary: Agent boot sequence, status discipline, and design vocabulary for this repo.
    depends_on: []

  - doc_id: status
    file: status.md
    title: Harness Status
    kind: state
    status: active
    summary: Current-state projection for the harness repo. Not a changelog.
    depends_on:
      - agents

  - doc_id: context
    file: state/CONTEXT.md
    title: Harness Context Briefing
    kind: orientation
    status: active
    summary: Condensed briefing for fresh agents; points to formal design and specs.
    depends_on:
      - v1-product-spec-and-roadmap
      - v1-process-domain-design

  - doc_id: v1-product-spec-and-roadmap
    file: design/v1-product-spec-and-roadmap.md
    title: "Formal Product Spec: V1 Portable Agent Harness"
    kind: formal-product-spec
    status: active
    summary: Directional v1 product intent, success criteria, roadmap phases, sequencing rules, and relationship to depth-gated incremental development.
    depends_on:
      - agnostic-harness-shape
      - portability-model

  - doc_id: v1-process-domain-design
    file: design/v1-process-domain-design.md
    title: "Formal Design: V1 Harness Process Domains"
    kind: formal-design
    status: active
    summary: Accepted baseline for the 15 formal v1 harness process domains and portable harness architecture.
    depends_on:
      - v1-product-spec-and-roadmap
      - agnostic-harness-shape
      - portability-model

  - doc_id: v1-installed-manifest-design
    file: design/v1-installed-manifest-design.md
    title: "Formal Design: V1 Installed Harness Manifest"
    kind: formal-design
    status: active
    summary: Accepted baseline for target-repo installed harness state, managed files, module records, doctor behavior, and upgrade safety.
    depends_on:
      - v1-process-domain-design

  - doc_id: v1-incremental-build-strategy
    file: design/v1-incremental-build-strategy.md
    title: "Formal Design: V1 Incremental Build Strategy"
    kind: formal-design
    status: active
    summary: Accepted short-term strategy of pairing process-domain integration with tooling, then deepening before adding more breadth.
    depends_on:
      - v1-process-domain-design
      - v1-installed-manifest-design

  - doc_id: v1-decisions-open-questions-design
    file: design/v1-decisions-open-questions-design.md
    title: "Formal Design: V1 Decisions And Open Questions"
    kind: formal-design
    status: active
    summary: Accepted baseline for decision records, open-question tracking, decision creation, and doctor validation.
    depends_on:
      - v1-process-domain-design
      - v1-incremental-build-strategy

  - doc_id: v1-module-profile-installation-design
    file: design/v1-module-profile-installation-design.md
    title: "Formal Design: V1 Module And Profile Installation"
    kind: formal-design
    status: active
    summary: Accepted baseline for registry-backed module listing, first installable-module commands, profile listing, and profile-backed init.
    depends_on:
      - v1-product-spec-and-roadmap
      - v1-installed-manifest-design

  - doc_id: installed-manifest
    file: .harness/manifest.yaml
    title: Installed Harness Manifest
    kind: dogfood-state
    status: active
    summary: Dogfood manifest recording the harness modules installed in this repo.
    depends_on:
      - v1-installed-manifest-design

  - doc_id: module-registry
    file: modules/registry.yaml
    title: Module Registry
    kind: module-registry
    status: active
    summary: Source registry of modules available for listing and installation.
    depends_on:
      - v1-module-profile-installation-design

  - doc_id: profile-minimal
    file: profiles/minimal.yaml
    title: Minimal Profile
    kind: profile-definition
    status: active
    summary: Minimal profile bundle for initial target repo installation.
    depends_on:
      - v1-module-profile-installation-design

  - doc_id: profile-dogfood
    file: profiles/dogfood.yaml
    title: Dogfood Profile
    kind: profile-definition
    status: active
    summary: Dogfood profile bundle used by the harness source repo.
    depends_on:
      - v1-module-profile-installation-design

  - doc_id: module-agent-operating-contract
    file: modules/agent-operating-contract/module.yaml
    title: Agent Operating Contract Module
    kind: module-definition
    status: active
    summary: Module definition for the Agent Operating Contract process domain.
    depends_on:
      - v1-process-domain-design
      - v1-installed-manifest-design

  - doc_id: module-progressive-orientation
    file: modules/progressive-orientation/module.yaml
    title: Progressive Orientation Module
    kind: module-definition
    status: active
    summary: Module definition for the Progressive Orientation process domain.
    depends_on:
      - v1-process-domain-design
      - v1-installed-manifest-design

  - doc_id: module-decisions-open-questions
    file: modules/decisions-open-questions/module.yaml
    title: Decisions And Open Questions Module
    kind: module-definition
    status: active
    summary: Module definition for decision records and open-question tracking.
    depends_on:
      - v1-decisions-open-questions-design
      - v1-installed-manifest-design

  - doc_id: open-questions
    file: open-questions.yaml
    title: Open Questions
    kind: state
    status: active
