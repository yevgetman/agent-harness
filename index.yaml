    kind: state
    status: active
    summary: Current-state projection for the harness repo, including v1 closeout, v1.1 installed-instance direction, lifecycle backups, installed process-domain baselines through Gardening And Entropy Management, and next depth/hardening work. Not a changelog.
    depends_on:
