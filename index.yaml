orientation:
  purpose: >
    Give agents a small boot path and a reading order before they inspect the
    full repo.
  boot_order:
    - AGENTS.md
    - status.md
    - index.yaml
    - state/CONTEXT.md
  rule: Start with the boot_order, then read only the relevant deeper docs.

